name: Conversation Governor tests
on:
  push:
    branches:
      - feature/conversation-governor-communication-only
      - feature/conversation-governor-ads-alignment-2026-10-26
  pull_request:
    paths:
      - 'skills/conversation-governor/**'
      - 'core/skill-architecture/**'
      - '.github/workflows/conversation-governor-tests.yml'
jobs:
  python-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Dependencies
        run: python -m pip install "jsonschema>=4.20,<5" "PyYAML>=6,<7" "referencing>=0.35,<1"
      - name: Syntax
        run: python -m compileall -q skills/conversation-governor/scripts skills/conversation-governor/tests
      - name: Skill tests
        working-directory: skills/conversation-governor
        run: python -m unittest discover -s tests -v
      - name: ADS candidate validation
        run: python core/scripts/validate_ads_bundle.py --skill-package skills/conversation-governor
      - name: Distribution
        run: python skills/conversation-governor/scripts/package_skill.py --repository-root . --output /tmp/conversation-governor.zip
